quarkus.application.name=azzo-assistant-api
quarkus.http.port=8081

quarkus.http.host=0.0.0.0
#quarkus.http.port=8080

# ─── Banco de dados (mesmo PostgreSQL do backend principal) ───────────────────
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=${DB_USERNAME:postgres}
%dev.quarkus.datasource.password=${DB_PASSWORD:postgres}
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/azzo?currentSchema=assistant_app}

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_URL}

# Pool de conexoes — evita "Closing connection in incorrect state VALIDATION"
# max-lifetime menor que o timeout do PostgreSQL; background-validation-interval
# proporcional ao max-lifetime para minimizar colisao entre validador e ciclo de vida
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=5
quarkus.datasource.jdbc.max-lifetime=PT4M
quarkus.datasource.jdbc.idle-removal-timeout=PT2M
quarkus.datasource.jdbc.background-validation-interval=PT1M
quarkus.datasource.jdbc.acquisition-timeout=PT10S

quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=assistant_app
quarkus.flyway.default-schema=assistant_app
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.repair-at-start=true

# ─── REST Client → Backend Principal ─────────────────────────────────────────
quarkus.rest-client.agenda-pro.url=${AGENDA_PRO_API_URL:http://localhost:8080}
quarkus.rest-client.agenda-pro.connect-timeout=5000
quarkus.rest-client.agenda-pro.read-timeout=10000

# ─── Autenticação interna ─────────────────────────────────────────────────────
app.internal.api-key=${INTERNAL_API_KEY:changeme-dev}

# ─── CORS ─────────────────────────────────────────────────────────────────────
quarkus.http.cors=true
%dev.quarkus.http.cors.origins=http://localhost:8080,http://localhost:5173
%prod.quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:8080}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,x-tenant-id,x-internal-api-key,x-user-identifier,x-user-name

# ─── JWT (leitura opcional) ───────────────────────────────────────────────────
mp.jwt.verify.issuer=azzo-agenda-pro
%dev.mp.jwt.verify.publickey.location=file:./publicKey.pem

# ─── Assistant ────────────────────────────────────────────────────────────────
assistant.conversation.ttl-minutes=${ASSISTANT_CONVERSATION_TTL_MINUTES:480}
assistant.conversation.max-history-messages=${ASSISTANT_CONVERSATION_MAX_HISTORY_MESSAGES:80}
assistant.conversation.keep-history-messages=${ASSISTANT_CONVERSATION_KEEP_HISTORY_MESSAGES:60}
assistant.conversation.max-history-chars=${ASSISTANT_MAX_HISTORY_CHARS:3000}
assistant.ai.training-dir=${ASSISTANT_AI_TRAINING_DIR:src/main/resources/ai/training}
assistant.ai.models-dir=${ASSISTANT_AI_MODELS_DIR:src/main/resources/ai/models}
assistant.greeting-zone=${ASSISTANT_GREETING_ZONE:America/Sao_Paulo}
assistant.intent.min-confidence=${ASSISTANT_INTENT_MIN_CONFIDENCE:0.62}
assistant.llm.default-max-tokens=${LLM_MAX_TOKENS:${ASSISTANT_LLM_DEFAULT_MAX_TOKENS:220}}
assistant.llm.default-temperature=${LLM_TEMPERATURE:0.2}
assistant.llm.short-response-max-tokens=${ASSISTANT_LLM_SHORT_RESPONSE_MAX_TOKENS:48}
assistant.llm.max-input-chars=${ASSISTANT_LLM_MAX_INPUT_CHARS:1000}

# ─── LLM local (llama.cpp server / llama-server, API OpenAI-compatible) ───────
# Trocado do Ollama nativo para llama.cpp — fala /v1/chat/completions.
# Desativado por padrão. Ativar com LLM_ENABLED=true (OLLAMA_ENABLED
# continua funcionando, por compatibilidade com deploys existentes).
assistant.ollama.enabled=${LLM_ENABLED:${OLLAMA_ENABLED:false}}
# Nome do modelo carregado no llama-server (ex.: azzo-atendimento).
# LLM_MODEL e' o nome novo; OLLAMA_MODEL continua funcionando.
assistant.ollama.model=${LLM_MODEL:${OLLAMA_MODEL:azzo-assistant-llama32}}
assistant.ollama.min-confidence=${OLLAMA_MIN_CONFIDENCE:0.75}

# Habilita geração de respostas humanizadas via LLM (listagem de serviços, profissionais, horários)
# Desligar com ASSISTANT_RESPONSE_LLM_ENABLED=false para usar apenas strings hardcoded
assistant.ollama.response.enabled=${ASSISTANT_RESPONSE_LLM_ENABLED:true}

# URL base do runtime LLM local (llama-server). LLM_BASE_URL e' o nome novo;
# OLLAMA_BASE_URL continua funcionando por compatibilidade.
# Ex.: http://llama-server:8080 (o client ja monta /v1/chat/completions).
quarkus.rest-client.local-llm.url=${LLM_BASE_URL:${OLLAMA_BASE_URL:http://localhost:11434}}
# Inferência em CPU pode ser lenta: 10s pra conectar, até 120s pra gerar a
# resposta. LLM_CONNECT_TIMEOUT_MS/LLM_TIMEOUT_MS sao em MILISSEGUNDOS (a
# propriedade do Quarkus exige esse formato) — se preferir configurar via
# LLM_TIMEOUT_SECONDS no compose, converta para ms ao setar LLM_TIMEOUT_MS
# (ex.: 120s -> LLM_TIMEOUT_MS=120000). OLLAMA_READ_TIMEOUT_MS continua
# funcionando por compatibilidade.
quarkus.rest-client.local-llm.connect-timeout=${LLM_CONNECT_TIMEOUT_MS:10000}
quarkus.rest-client.local-llm.read-timeout=${LLM_TIMEOUT_MS:${OLLAMA_READ_TIMEOUT_MS:120000}}

# Ativa o LLM local automaticamente em dev local
%dev.assistant.ollama.enabled=true

# ─── Agente LLM ───────────────────────────────────────────────────────────────
# true = LLM conduz toda a conversa (novo), false = máquina de estados Java (legado)
assistant.agent.enabled=${ASSISTANT_AGENT_ENABLED:false}
%dev.assistant.agent.enabled=true

# ─── Groq API (LLM primário — free tier até 14.400 req/dia) ───────────────────
# Obtenha sua chave em: https://console.groq.com/keys
assistant.groq.enabled=${GROQ_ENABLED:false}
assistant.groq.api-key=${GROQ_API_KEY:}
# Modelos recomendados: llama-3.1-8b-instant (rápido, barato) | llama-3.3-70b-versatile (melhor qualidade)
assistant.groq.model=${GROQ_MODEL:llama-3.1-8b-instant}
# Limite diário seguro antes de fazer fallback para Ollama (free tier = 14.400/dia)
assistant.groq.daily-limit=${GROQ_DAILY_LIMIT:12000}
assistant.groq.rate-limit-cooldown-ms=${GROQ_RATE_LIMIT_COOLDOWN_MS:15000}

quarkus.rest-client.groq.url=${GROQ_BASE_URL:https://api.groq.com}
quarkus.rest-client.groq.connect-timeout=5000
quarkus.rest-client.groq.read-timeout=${GROQ_READ_TIMEOUT_MS:30000}

# Em dev: habilita Groq se a chave estiver definida
%dev.assistant.groq.enabled=true

# ─── Rotas públicas ───────────────────────────────────────────────────────────
# Apenas health checks sao realmente publicos. Os endpoints do assistente
# (/api/v1/assistant/message e /api/v1/assistant/admin/*) sao protegidos pelo
# InternalApiKeyFilter, que exige o header X-Internal-Api-Key (service-to-service).
quarkus.http.auth.permission.public.paths=/q/health,/q/health/*
quarkus.http.auth.permission.public.policy=permit
# Swagger / OpenAPI — habilitado apenas em dev; desabilitado em producao publica.
%dev.quarkus.swagger-ui.always-include=true
%dev.quarkus.smallrye-openapi.path=/q/openapi
%dev.quarkus.swagger-ui.path=/q/swagger-ui
%prod.quarkus.swagger-ui.enable=false
%prod.quarkus.smallrye-openapi.enable=false
# ─── Logging ──────────────────────────────────────────────────────────────────
quarkus.log.console.enable=true
%dev.quarkus.log.level=INFO
%prod.quarkus.log.level=INFO
%prod.quarkus.log.console.json=true

# =====================
# Métricas (Prometheus)
# =====================
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true

# =====================
# OpenTelemetry
# =====================
quarkus.otel.enabled=false

# =====================
# Debug
# =====================
# Quando true, habilita trace completo do fluxo do assistant:
#   flow.message.received  → mensagem recebida com conteudo
#   flow.service.calling   → antes de chamar AssistantConversationService.process()
#   flow.service.replied   → apos retorno do servico (stage, replyLength, elapsedMs, reply truncado)
#   flow.response.sent     → resposta enviada ao caller (stage, elapsedMs)
# Ativar com APP_ASSISTANT_DEBUG=true
app.assistant.debug=${APP_ASSISTANT_DEBUG:false}

# =====================
# Pool de provedores de LLM (feature/pool-provedores-llm)
# =====================
# Quando true, o roteamento de LLM usa o novo pool (provedores/chaves cadastrados no banco).
# Quando false (padrao), mantem o fluxo legado (LlmRouter Groq/Ollama) — retrocompatibilidade.
assistant.llm.pool.enabled=${LLM_POOL_ENABLED:false}
# Estrategia de roteamento padrao do pool.
assistant.llm.pool.default-strategy=${LLM_POOL_STRATEGY:BALANCEADO}
# Chave de criptografia das credenciais (AES 16/24/32 bytes, base64 ou texto).
# Mesmo padrao do token do WhatsApp no agenda-pro. Deixe vazio no fluxo legado.
assistant.security.encryption-key=${ASSISTANT_ENCRYPTION_KEY:}
